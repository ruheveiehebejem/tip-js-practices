services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tip_tasks
      POSTGRES_USER: tip_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tip_app -d tip_tasks"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5505
      NODE_ENV: production
      LOG_LEVEL: info
      RELEASE_VERSION: ${RELEASE_VERSION:-1.0.0}
      DATABASE_URL: postgresql://tip_app:${POSTGRES_PASSWORD}@db:5432/tip_tasks
      ENABLE_DEBUG_RESET: "false"
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-16384}
    ports:
      - "${API_PORT:-5505}:5505"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5505/health/ready').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
