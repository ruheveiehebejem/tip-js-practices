name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tip_tasks_test
          POSTGRES_USER: tip_app
          POSTGRES_PASSWORD: tip_password
        options: >-
          --health-cmd "pg_isready -U tip_app -d tip_tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://tip_app:tip_password@127.0.0.1:5432/tip_tasks_test
      API_HOST: 127.0.0.1
      API_PORT: 5505
      NODE_ENV: test
      LOG_LEVEL: error
      RELEASE_VERSION: 1.0.0
      ENABLE_DEBUG_RESET: "false"
      JSON_BODY_LIMIT_BYTES: 16384
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Quality and PostgreSQL tests
        run: npm run release:check
      - name: Start API for smoke test
        run: |
          npm start > /tmp/tip-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5505/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tip-api.log
          exit 1
      - name: Smoke test
        run: npm run smoke
      - name: Build production image
        run: docker build --tag tip-pr14:${{ github.sha }} .
